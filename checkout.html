<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>確認購買</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="nav"><div class="logo">🧾 確認購買</div><button class="mobileNavToggle" type="button" aria-expanded="false">☰ 選單</button><nav><a href="index.html">首頁</a><a href="products.html">商品</a><a href="my.html#myOrdersPanel">🧾 我的訂單</a><a href="my.html">👤 我的</a><a class="admin" href="admin.html">👑 管理員</a><button id="visitorLogout" class="hidden">登出</button></nav></div></header>
<main><section><div id="checkoutGate" class="gate inlineGate hidden"><div class="gate-card"><div class="lock">🔐</div><h2>請先登入</h2><p>購買商品前請先登入會員帳號。</p><a class="btn" href="index.html">返回登入</a></div></div><div id="checkoutPanel" class="checkoutPanel hidden"><div class="panelHeading"><div><h1>🧾 確認購買</h1><p class="sub">付款方式目前只接受線下現金付款。</p></div></div><div id="checkoutProduct" class="checkoutProduct"></div><div class="checkoutPayment"><h3>💵 付款方式</h3><div class="cashPayment"><strong>線下現金付款</strong><p>建立訂單後，請依管理員提供的方式現場支付現金。管理員確認收到款項後，訂單會更新為「已付款」。</p></div></div><label class="formField"><span>購買數量</span><input id="checkoutQuantity" type="number" min="1" step="1" value="1"></label><label class="formField"><span>備註（可留空）</span><textarea id="checkoutNote" rows="3" maxlength="500" placeholder="例如：方便聯絡的時間"></textarea></label><div id="checkoutTotal" class="checkoutTotal"></div><div class="competitionActions"><button class="btn" id="createCashOrder" type="button">🧾 建立現金訂單</button><a class="btn secondary" href="products.html">返回商品</a></div><small id="checkoutMsg"></small></div><div id="checkoutSuccess" class="checkoutSuccess hidden"></div></section></main>
<script src="config.js"></script><script src="app.js?v=order-v1"></script><script>
let checkoutProduct=null;
function checkoutEsc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]) )}
async function loadCheckout(){
  const ok=await ensureVisitorSession();
  if(!ok){$('checkoutGate').classList.remove('hidden');return}
  $('visitorLogout')?.classList.remove('hidden');
  const id=new URLSearchParams(location.search).get('product_id');
  if(!id){$('checkoutPanel').classList.remove('hidden');$('checkoutProduct').innerHTML='<div class="empty">找不到商品。</div>';return}
  const r=await fetch(SUPABASE_URL+'/rest/v1/products?id=eq.'+encodeURIComponent(id)+'&active=eq.true&select=id,name,category,price,image_url,description',{headers:auth()});
  const rows=r.ok?await r.json():[]; checkoutProduct=rows[0];
  $('checkoutPanel').classList.remove('hidden');
  if(!checkoutProduct){$('checkoutProduct').innerHTML='<div class="empty">商品不存在或目前未上架。</div>';$('createCashOrder').disabled=true;return}
  $('checkoutProduct').innerHTML=(checkoutProduct.image_url?'<img src="'+checkoutEsc(checkoutProduct.image_url)+'" alt="'+checkoutEsc(checkoutProduct.name)+'">':'<div class="productImage">📦</div>')+'<div><div class="date">'+checkoutEsc(checkoutProduct.category||'商品')+'</div><h2>'+checkoutEsc(checkoutProduct.name)+'</h2><p>'+checkoutEsc(checkoutProduct.description||'')+'</p><strong>NT$ '+Number(checkoutProduct.price||0).toLocaleString()+'</strong></div>';
  updateTotal();
}
function updateTotal(){if(!checkoutProduct)return;const q=Math.max(1,Number($('checkoutQuantity').value||1));$('checkoutQuantity').value=q;$('checkoutTotal').innerHTML='應付總額：<strong>NT$ '+(Number(checkoutProduct.price||0)*q).toLocaleString()+'</strong>'}
async function createCashOrder(){if(!checkoutProduct)return;const btn=$('createCashOrder');btn.disabled=true;btn.textContent='建立中…';$('checkoutMsg').textContent='';try{const q=Math.max(1,Number($('checkoutQuantity').value||1));const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/create_cash_order',{method:'POST',headers:{...auth(),Prefer:'return=representation'},body:JSON.stringify({p_product_id:checkoutProduct.id,p_quantity:q,p_note:$('checkoutNote').value.trim()||null})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||d.hint||d.error||'建立訂單失敗');$('checkoutPanel').classList.add('hidden');$('checkoutSuccess').classList.remove('hidden');$('checkoutSuccess').innerHTML='<div class="successIcon">✅</div><h2>訂單已建立</h2><p>訂單編號：<strong>'+checkoutEsc(d.order_no)+'</strong></p><p>應付金額：<strong>NT$ '+Number(d.total_amount||0).toLocaleString()+'</strong></p><p>付款方式：<strong>線下現金付款</strong></p><p class="sub">請依管理員提供的方式支付現金。確認收款後，訂單會變更為「已付款」。</p><div class="competitionActions"><a class="btn" href="my.html#myOrdersPanel">🧾 查看我的訂單</a><a class="btn secondary" href="products.html">繼續購買</a></div>';}catch(e){console.error(e);$('checkoutMsg').textContent='❌ '+e.message;}finally{btn.disabled=false;btn.textContent='🧾 建立現金訂單'}}
window.addEventListener('DOMContentLoaded',()=>{loadCheckout();$('checkoutQuantity')?.addEventListener('input',updateTotal);$('createCashOrder')?.addEventListener('click',createCashOrder);});
</script></body></html>
