<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🎬 影音頻道</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="nav"><div class="logo" id="siteName">商業簡介</div><button class="mobileNavToggle" type="button" aria-expanded="false">☰ 選單</button><nav><a href="index.html">首頁</a><a href="news.html">最新消息</a><a href="videos.html">🎬 影音頻道</a><a href="products.html">商品</a><a href="my.html">👤 我的</a><a href="competitions.html">🏆 歷屆成績</a><a href="search.html">🔍 搜尋</a><a class="admin" href="admin.html">👑 管理員</a></nav></div></header>
<main class="container" style="max-width:1200px;margin:0 auto;padding:32px 18px"><div class="dashboardHeader"><div><h1>🎬 影音頻道</h1><p class="sub">在網站內觀看 YouTube 影片，也可以一鍵前往 YouTube。</p></div></div><div class="adminListTools" style="margin:18px 0"><input id="videoSearch" type="search" placeholder="搜尋影片標題、介紹"><select id="videoCategory"><option value="all">全部分類</option></select></div><div id="featuredVideo"></div><div id="videoGrid" class="productGrid"></div><div id="videoEmpty" class="empty hidden">目前沒有上架影片。</div></main>
<script src="config.js"></script><script>
const $=id=>document.getElementById(id);let videos=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function ytId(u){try{const x=new URL(u);if(x.hostname.includes('youtu.be'))return x.pathname.slice(1).split('/')[0];if(x.searchParams.get('v'))return x.searchParams.get('v');const m=x.pathname.match(/\/(?:embed|shorts)\/([^/?]+)/);return m?m[1]:''}catch{return ''}}
function render(){const q=($('videoSearch').value||'').toLowerCase(),c=$('videoCategory').value;const rows=videos.filter(v=>(c==='all'||v.category===c)&&(!q||[v.title,v.description,v.category].some(x=>String(x||'').toLowerCase().includes(q))));$('videoEmpty').classList.toggle('hidden',!!rows.length);const f=rows.find(v=>v.featured);$('featuredVideo').innerHTML=f?`<article class="notice" style="margin-bottom:22px"><div class="date">⭐ 精選影片 · ${esc(f.category)}</div><h2>${esc(f.title)}</h2><p>${esc(f.description)}</p><div style="aspect-ratio:16/9;max-width:900px"><iframe src="https://www.youtube.com/embed/${encodeURIComponent(f.youtube_id)}" title="${esc(f.title)}" style="width:100%;height:100%;border:0;border-radius:14px" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><p style="margin-top:12px"><a class="btn" href="${esc(f.youtube_url)}" target="_blank" rel="noopener">▶️ 在 YouTube 開啟</a></p></article>`:'';const rest=rows.filter(v=>!f||v.id!==f.id);$('videoGrid').innerHTML=rest.map(v=>`<article class="productCard"><div style="position:relative"><img src="${esc(v.thumbnail_url)}" alt="${esc(v.title)}" loading="lazy" style="width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px"><span style="position:absolute;left:12px;bottom:12px;background:#111c;color:#fff;padding:6px 10px;border-radius:999px">▶️</span></div><div class="productCardBody"><div class="date">${esc(v.category)} · ${esc(new Date(v.published_at).toLocaleDateString('zh-TW'))}</div><h3>${esc(v.title)}</h3><p>${esc(v.description||'')}</p><button class="btn" onclick="watch('${v.id}')">▶️ 網站觀看</button> <a class="btn secondary" href="${esc(v.youtube_url)}" target="_blank" rel="noopener">YouTube</a></div></article>`).join('')}
function watch(id){const v=videos.find(x=>x.id===id);if(!v)return;const modal=document.createElement('div');modal.style='position:fixed;inset:0;background:#000b;z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px';modal.innerHTML=`<div style="background:var(--card,#fff);width:min(1000px,100%);padding:16px;border-radius:16px"><button class="btn secondary" style="float:right" onclick="this.closest('[style*=fixed]').remove()">✕ 關閉</button><h2>${esc(v.title)}</h2><div style="aspect-ratio:16/9"><iframe src="https://www.youtube.com/embed/${encodeURIComponent(v.youtube_id)}?autoplay=1" title="${esc(v.title)}" style="width:100%;height:100%;border:0;border-radius:12px" allow="autoplay; encrypted-media; picture-in-picture; web-share" allowfullscreen></iframe></div><p>${esc(v.description||'')}</p><a class="btn" href="${esc(v.youtube_url)}" target="_blank" rel="noopener">▶️ 在 YouTube 開啟</a></div>`;document.body.appendChild(modal)}
async function load(){if(typeof SUPABASE_URL==='undefined'||!SUPABASE_URL)return;const r=await fetch(SUPABASE_URL+'/rest/v1/videos?select=*&published=eq.true&order=sort_order.asc,published_at.desc',{headers:{apikey:SUPABASE_ANON_KEY}});videos=r.ok?await r.json():[];const cs=[...new Set(videos.map(v=>v.category))];$('videoCategory').innerHTML='<option value="all">全部分類</option>'+cs.map(c=>`<option>${esc(c)}</option>`).join('');render()}
$('videoSearch').oninput=render;$('videoCategory').onchange=render;load();
</script></body></html>
